name: ${COMPOSE_PROJECT_NAME:-openwahi-dev}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openwahi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openwahi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-openwahi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openwahi} -d ${POSTGRES_DB:-openwahi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-dev:/qdrant/storage

  # S3-compatible object storage. pgsty/silo is a community-maintained MinIO
  # fork (same S3 API, MINIO_* variables and on-disk format).
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-openwahi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-openwahi_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-dev:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-openwahi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-openwahi_dev_password}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-openwahi}
    depends_on:
      minio:
        condition: service_healthy

  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.2.2
    restart: unless-stopped
    user: root
    ports:
      - "${WHATSAPP_PORT:-3001}:3000"
    volumes:
      - whatsapp-dev:/app/storages
    environment:
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      APP_DEBUG: "true"
      APP_OS: Chrome
      APP_BASIC_AUTH: ${WHATSAPP_USER:-admin}:${WHATSAPP_PASSWORD:-dev-secret}
      WHATSAPP_AUTO_MARK_READ: "false"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "true"
      WHATSAPP_WEBHOOK: http://backend:8000/whatsapp/webhook
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-dev-webhook-secret}
      WHATSAPP_WEBHOOK_EVENTS: message,message.ack,message.reaction,message.revoked,group.participants,connection,state
      DB_URI: file:storages/whatsapp.db?_foreign_keys=on

  transcriber:
    build:
      context: ./transcriber
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-10.0}
      PORT: 8001
      LOG_LEVEL: DEBUG
    ports:
      - "${TRANSCRIBER_PORT:-8001}:8001"
    volumes:
      - ./transcriber:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      APP_NAME: ${APP_NAME:-OpenWahi}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openwahi}:${POSTGRES_PASSWORD:-openwahi_dev_password}@postgres:5432/${POSTGRES_DB:-openwahi}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-your-firebase-project-id}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      ENVIRONMENT: development
      DEBUG: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY is required (generate a Fernet key)}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-http://llamacpp:8080/v1}
      LLAMACPP_MODEL: ${LLAMACPP_MODEL:-Qwen3.5-0.8B-Q8_0}
      MANAGED_AI_PROVIDER: ${MANAGED_AI_PROVIDER:-llamacpp}
      MANAGED_AI_MODEL: ${MANAGED_AI_MODEL:-Qwen3.5-0.8B-Q8_0}
      GOWA_HOST: whatsapp
      GOWA_PORT: 3000
      WHATSAPP_USER: ${WHATSAPP_USER:-admin}
      WHATSAPP_PASSWORD: ${WHATSAPP_PASSWORD:-dev-secret}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-dev-webhook-secret}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openwahi}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openwahi_dev_password}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-openwahi}
      S3_REGION: ${S3_REGION:-us-east-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-multi-qa-MiniLM-L6-cos-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      TRANSCRIBER_URL: http://transcriber:8001
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-1.0}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      DOCKER_CONTAINER: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./secrets/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      whatsapp:
        condition: service_started
      transcriber:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  llamacpp:
    build:
      context: ./llamacpp
    restart: unless-stopped
    command:
      - --model
      - /models/Qwen3.5-0.8B-Q8_0.gguf
      - --alias
      - ${LLAMACPP_MODEL:-Qwen3.5-0.8B-Q8_0}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMACPP_CONTEXT_SIZE:-4096}
      - --parallel
      - "1"
      - --threads
      - ${LLAMACPP_THREADS:-4}
      - --n-predict
      - ${LLAMACPP_MAX_TOKENS:-512}
    cpus: ${LLAMACPP_CPUS:-4.0}
    mem_limit: ${LLAMACPP_MEMORY_LIMIT:-3g}
    pids_limit: 256
    ports:
      - "127.0.0.1:${LLAMACPP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  postgres-dev:
  qdrant-dev:
  minio-dev:
  whatsapp-dev:
